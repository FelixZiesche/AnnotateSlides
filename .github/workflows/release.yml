name: Release

# Push a tag like v1.0.0 to build a signed APK and publish it as a GitHub release
# (Obtainium picks it up from there).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got $TAG)"; exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "::error::Minor and patch must be 0-99"; exit 1
          fi
          # versionCode grows with every higher tag: v1.2.3 -> 10203
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "versionName ${MAJOR}.${MINOR}.${PATCH}, versionCode ${CODE}"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANNOTATE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANNOTATE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets ANNOTATE_KEYSTORE_BASE64 and ANNOTATE_KEYSTORE_PASSWORD must be set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          ANNOTATE_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANNOTATE_KEYSTORE_PASSWORD: ${{ secrets.ANNOTATE_KEYSTORE_PASSWORD }}
          ANNOTATE_KEY_ALIAS: annotateslides
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Verify signature
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1)
          if [ -z "$APK" ]; then echo "::error::No signed APK found"; ls -R app/build/outputs/apk; exit 1; fi
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner
          "$APKSIGNER" verify --print-certs "$APK"
          OUT="AnnotateSlides-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" \
            --title "Annotate Slides $GITHUB_REF_NAME" \
            --generate-notes

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
